<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samanvay · Block Planning</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="topbar">
      <img class="brand-logo" src="logo.jpg" alt="Samanvay — Integrated Railway Maintenance Planning" />
      <nav class="pipeline">
        <a href="index.html"><span class="step-n num">1</span>Operations</a>
        <span class="sep">→</span>
        <a href="tasks.html" class="active"><span class="step-n num">2</span>Tasks</a>
        <span class="sep">→</span>
        <a href="plan.html"><span class="step-n num">3</span>Plan</a>
      </nav>
      <div class="context">
        <select aria-label="Corridor"></select>
        <input type="date" min="2026-09-01" max="2026-09-28" aria-label="Plan date" />
      </div>
    </header>

    <div class="page" id="page" style="display: none">
      <div class="page-head">
        <h1 class="page-title">Maintenance tasks</h1>
      </div>

      <div class="filterbar">
        <div class="chips" role="group" aria-label="Status filter" id="bucket-chips"></div>
        <div class="divider"></div>
        <div class="seg" role="group" aria-label="Department filter" id="dept-seg"></div>
      </div>

      <div class="tablewrap">
        <table class="data">
          <thead>
            <tr>
              <th style="width: 20px"></th>
              <th>Task</th>
              <th>Work</th>
              <th>Dept</th>
              <th>Section</th>
              <th class="r">Needs</th>
              <th>Due</th>
              <th>Risk</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="task-rows"></tbody>
        </table>
        <div class="empty" id="empty" style="display: none">Nothing here — this queue is clear.</div>
      </div>
    </div>

    <div class="loading" id="loading">Merging TMS · SMMS · TDMS…</div>

    <script src="js/plan.js"></script>
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/tasks.js"></script>
  </body>
</html>
